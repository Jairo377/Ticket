<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Ticket de envío</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #111827;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 16px;
  }

  /* Contenedor exacto 4x3 pulgadas */
  .page {
    width: 4in;
    height: 3in;
    padding: 0.045in;
    background: #fff;
    color: #000;
    font-family: Arial, Helvetica, sans-serif;
    overflow: hidden;
    box-shadow: 0 10px 25px rgba(0,0,0,0.5);
  }

  .ticket {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    border: 1.5px solid #000;
  }

  .top {
    height: 67.7%;
    display: flex;
    border-bottom: 1.5px solid #000;
  }

  .details {
    width: 66.4%;
    padding: 0 0.08in;
    display: flex;
    flex-direction: column;
    justify-content: space-around;
    border-right: 1.5px solid #000;
    font-size: 13.5pt;
    line-height: 1.1;
    overflow: hidden;
  }

  .summary {
    flex: 1;
    display: flex;
    flex-direction: column;
  }

  .total {
    height: 60%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border-bottom: 1.5px solid #000;
    font-weight: bold;
    line-height: 1;
  }
  .total-label  { font-size: 26pt; }
  .total-amount { font-size: 18pt; margin-top: 0.04in; }

  .charges {
    flex: 1;
    padding: 0 0.05in;
    display: flex;
    flex-direction: column;
    justify-content: space-around;
    font-size: 9.5pt;
    font-weight: bold;
    white-space: nowrap;
  }

  .barcode-area {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0.05in;
  }

  .barcode {
    width: 2.6in;
    height: 80%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .barcode svg {
    width: 100%;
    height: 100%;
    display: block;
  }

  /* Botones grandes para iPhone / iPad */
  .actions {
    margin-top: 24px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: 100%;
    max-width: 4in;
  }

  .btn {
    background: #2563eb;
    color: #fff;
    border: none;
    padding: 16px;
    border-radius: 12px;
    font-size: 17px;
    font-weight: 700;
    cursor: pointer;
    text-align: center;
    box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
    -webkit-tap-highlight-color: transparent;
  }
  .btn:active {
    transform: scale(0.98);
  }

  .btn-pdf {
    background: #374151;
    font-size: 15px;
    padding: 14px;
    box-shadow: none;
  }
</style>
</head>
<body>

  <!-- Etiqueta exacta de 4x3 pulgadas -->
  <div class="page" id="etiqueta">
    <main class="ticket">

      <section class="top">
        <div class="details">
          <div id="Nombre"></div>
          <div id="Numero"></div>
          <div id="Direccion"></div>
          <div id="FechaViaje"></div>
          <div id="Ruta">Ruta: -</div>
        </div>

        <aside class="summary">
          <div class="total">
            <div class="total-label">TOTAL</div>
            <div class="total-amount" id="Total">$0.00</div>
          </div>
          <div class="charges">
            <div id="Totalitems">Articulos: $0.00</div>
            <div id="Envio">Envio: $0.00</div>
          </div>
        </aside>
      </section>

      <section class="barcode-area">
        <div class="barcode">
          <svg id="barcode"></svg>
        </div>
      </section>

    </main>
  </div>

  <div class="actions">
    <button class="btn" id="btn-jadens" onclick="enviarAJadensImagen()">
      🖨️ Enviar directo a Jadens Printer
    </button>
    <button class="btn btn-pdf" onclick="enviarComoPDF()">
      📄 Abrir vía PDF (4×3 Horizontal)
    </button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <script>
    let idPaqueteGlobal = 'ticket';
    let archivoImagenListo = null;
    let archivoPDFListo = null;

    window.onload = async function() {
      const params = new URLSearchParams(window.location.search);

      const nombre     = params.get('Nombre') || '';
      const numero     = params.get('Numero') || '';
      const direccion  = params.get('Direccion') || '';
      const fechaViaje = params.get('FechaViaje') || '';
      const ruta       = params.get('Ruta') && params.get('Ruta').trim() !== '' ? params.get('Ruta') : '-';

      const totalItems = params.get('Totalitems') || '0.00';
      const envio      = params.get('Envio') || '0.00';
      const total      = params.get('Total') || '0.00';
      idPaqueteGlobal  = params.get('IDPaquete') || numero || '00000000';

      document.getElementById('Nombre').textContent     = nombre;
      document.getElementById('Numero').textContent     = numero;
      document.getElementById('Direccion').textContent  = direccion;
      document.getElementById('FechaViaje').textContent = fechaViaje;
      document.getElementById('Ruta').textContent       = 'Ruta: ' + ruta;

      document.getElementById('Totalitems').textContent = 'Articulos: $' + totalItems;
      document.getElementById('Envio').textContent      = 'Envio: $' + envio;
      document.getElementById('Total').textContent      = '$' + total;

      JsBarcode("#barcode", idPaqueteGlobal, {
        format: "CODE128",
        displayValue: false,
        margin: 0,
        width: 2,
        height: 50
      });

      // Pre-generamos la etiqueta en segundo plano apenas carga la página (tarda ~0.2 seg)
      await preGenerarArchivos();
    };

    async function preGenerarArchivos() {
      const elemento = document.getElementById('etiqueta');
      const canvas = await html2canvas(elemento, {
        scale: 3, // Alta definición para térmica de 203/300 DPI
        backgroundColor: '#ffffff',
        useCORS: true
      });

      // 1. Preparamos versión PNG (Jadens Printer sí aparece directo al compartir imágenes)
      const imgBlob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png', 1.0));
      archivoImagenListo = new File([imgBlob], `Ticket_${idPaqueteGlobal}.png`, { type: 'image/png' });

      // 2. Preparamos versión PDF 4x3 pulgadas horizontal exacta
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF({
        orientation: 'landscape',
        unit: 'in',
        format: [4, 3]
      });
      const imgData = canvas.toDataURL('image/jpeg', 1.0);
      pdf.addImage(imgData, 'JPEG', 0, 0, 4, 3);
      const pdfBlob = pdf.output('blob');
      archivoPDFListo = new File([pdfBlob], `Ticket_${idPaqueteGlobal}.pdf`, { type: 'application/pdf' });
    }

    // OPCIÓN 1: Comparte como Imagen PNG 4x3 -> Jadens Printer sale de una vez en el menú de iOS
    async function enviarAJadensImagen() {
      if (!archivoImagenListo) await preGenerarArchivos();
      if (navigator.canShare && navigator.canShare({ files: [archivoImagenListo] })) {
        await navigator.share({
          files: [archivoImagenListo]
        });
      }
    }

    // OPCIÓN 2: Comparte como PDF 4x3 horizontal pregenerado
    async function enviarComoPDF() {
      if (!archivoPDFListo) await preGenerarArchivos();
      if (navigator.canShare && navigator.canShare({ files: [archivoPDFListo] })) {
        await navigator.share({
          files: [archivoPDFListo]
        });
      }
    }
  </script>
</body>
</html>
