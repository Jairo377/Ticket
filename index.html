<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Ticket de envío</title>
<style>
  @page {
    size: 4in 3in landscape;
    margin: 0 !important;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #ffffff;
    color: #000;
    font-family: Arial, Helvetica, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    margin: 0;
  }

  .page {
    width: 4in;
    height: 3in;
    padding: 0.045in;
    background: #fff;
    color: #000;
    overflow: hidden;
  }

  .ticket {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    border: 1.5px solid #000;
  }

  .top {
    height: 67.7%;
    display: flex;
    border-bottom: 1.5px solid #000;
  }

  .details {
    width: 66.4%;
    padding: 0 0.08in;
    display: flex;
    flex-direction: column;
    justify-content: space-around;
    border-right: 1.5px solid #000;
    font-size: 13.5pt;
    line-height: 1.1;
    overflow: hidden;
  }

  .summary {
    flex: 1;
    display: flex;
    flex-direction: column;
  }

  .total {
    height: 60%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border-bottom: 1.5px solid #000;
    font-weight: bold;
    line-height: 1;
  }
  .total-label  { font-size: 26pt; }
  .total-amount { font-size: 18pt; margin-top: 0.04in; }

  .charges {
    flex: 1;
    padding: 0 0.05in;
    display: flex;
    flex-direction: column;
    justify-content: space-around;
    font-size: 9.5pt;
    font-weight: bold;
    white-space: nowrap;
  }

  .barcode-area {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0.05in;
  }

  .barcode {
    width: 2.6in;
    height: 80%;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .barcode svg {
    width: 100%;
    height: 100%;
    display: block;
  }

  @media print {
    body {
      background: #fff;
      padding: 0;
      margin: 0;
    }
  }
</style>
</head>
<body>

  <div class="page" id="etiqueta">
    <main class="ticket">

      <section class="top">
        <div class="details">
          <div id="Nombre"></div>
          <div id="Numero"></div>
          <div id="Direccion"></div>
          <div id="FechaViaje"></div>
          <div id="Ruta">Ruta: -</div>
        </div>

        <aside class="summary">
          <div class="total">
            <div class="total-label">TOTAL</div>
            <div class="total-amount" id="Total">$0.00</div>
          </div>
          <div class="charges">
            <div id="Totalitems">Articulos: $0.00</div>
            <div id="Envio">Envio: $0.00</div>
          </div>
        </aside>
      </section>

      <section class="barcode-area">
        <div class="barcode">
          <svg id="barcode"></svg>
        </div>
      </section>

    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>

  <script>
    window.onload = function() {
      const params = new URLSearchParams(window.location.search);

      const nombre     = params.get('Nombre') || '';
      const numero     = params.get('Numero') || '';
      const direccion  = params.get('Direccion') || '';
      const fechaViaje = params.get('FechaViaje') || '';
      const ruta       = params.get('Ruta') && params.get('Ruta').trim() !== '' ? params.get('Ruta') : '-';

      const totalItems = params.get('Totalitems') || '0.00';
      const envio      = params.get('Envio') || '0.00';
      const total      = params.get('Total') || '0.00';
      const idPaquete  = params.get('IDPaquete') || numero || '00000000';

      document.getElementById('Nombre').textContent     = nombre;
      document.getElementById('Numero').textContent     = numero;
      document.getElementById('Direccion').textContent  = direccion;
      document.getElementById('FechaViaje').textContent = fechaViaje;
      document.getElementById('Ruta').textContent       = 'Ruta: ' + ruta;

      document.getElementById('Totalitems').textContent = 'Articulos: $' + totalItems;
      document.getElementById('Envio').textContent      = 'Envio: $' + envio;
      document.getElementById('Total').textContent      = '$' + total;

      JsBarcode("#barcode", idPaquete, {
        format: "CODE128",
        displayValue: false,
        margin: 0,
        width: 2,
        height: 50
      });

      // Lanza la impresión de forma automática en cuanto cargan los datos y el código de barras
      setTimeout(() => {
        window.print();
      }, 300);
    };
  </script>
</body>
</html>
